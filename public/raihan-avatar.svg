<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142c52" />
      <stop offset="45%" stop-color="#1e3f74" />
      <stop offset="100%" stop-color="#0e1d38" />
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="frameBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Skin Gradients -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2aa84" />
      <stop offset="55%" stop-color="#c98a5e" />
      <stop offset="100%" stop-color="#ae6e43" />
    </linearGradient>
    <radialGradient id="cheekHighlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2be9b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c98a5e" stop-opacity="0" />
    </radialGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241e1b" />
      <stop offset="40%" stop-color="#141110" />
      <stop offset="100%" stop-color="#0a0807" />
    </linearGradient>
    <linearGradient id="hairHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d332e" />
      <stop offset="100%" stop-color="#1c1614" />
    </linearGradient>

    <!-- Suit Gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3547" />
      <stop offset="50%" stop-color="#1b2331" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>

    <!-- Pinstripe Pattern -->
    <pattern id="pinstripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(5)">
      <line x1="7" y1="0" x2="7" y2="14" stroke="#475569" stroke-width="0.85" stroke-opacity="0.5" />
    </pattern>

    <!-- Cyan LED Glow Filters -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cyanGlowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND: CYBER TECH UI SCREEN -->
  <!-- Base Tech Gradient Card -->
  <rect x="15" y="15" width="470" height="470" rx="28" fill="url(#bgGrad)" stroke="url(#frameBorder)" stroke-width="2.5" />

  <!-- Inner HUD frame line -->
  <rect x="30" y="30" width="440" height="440" rx="20" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- TOP LEFT: "CHAT BOT" HEADER & DATA BARS -->
  <text x="48" y="66" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="21" letter-spacing="1.5">CHAT BOT</text>
  
  <!-- Stacked Telemetry Data Bars -->
  <g opacity="0.75" transform="translate(48, 86)">
    <!-- Row 1: DATA -->
    <circle cx="4" cy="4" r="2.5" fill="#38bdf8" />
    <text x="14" y="7" fill="#7dd3fc" font-family="system-ui, monospace" font-size="9" font-weight="700">DATA</text>
    <rect x="46" y="2" width="28" height="4.5" rx="2" fill="#38bdf8" />

    <!-- Row 2: DATA -->
    <circle cx="4" cy="18" r="2.5" fill="#38bdf8" />
    <text x="14" y="21" fill="#7dd3fc" font-family="system-ui, monospace" font-size="9" font-weight="700">DATA</text>
    <rect x="46" y="16" width="28" height="4.5" rx="2" fill="#38bdf8" />

    <!-- Row 3: OBTO -->
    <circle cx="4" cy="32" r="2.5" stroke="#38bdf8" stroke-width="1" fill="none" />
    <text x="14" y="35" fill="#7dd3fc" font-family="system-ui, monospace" font-size="9" font-weight="700">OBTO</text>
    <rect x="46" y="30" width="24" height="4.5" rx="2" fill="#38bdf8" />

    <!-- Row 4: CBST -->
    <circle cx="4" cy="46" r="2.5" stroke="#38bdf8" stroke-width="1" fill="none" />
    <text x="14" y="49" fill="#7dd3fc" font-family="system-ui, monospace" font-size="9" font-weight="700">CBST</text>
    <rect x="46" y="44" width="20" height="4.5" rx="2" fill="#38bdf8" />

    <!-- Row 5: POEST -->
    <circle cx="4" cy="60" r="2.5" stroke="#38bdf8" stroke-width="1" fill="none" />
    <text x="14" y="63" fill="#7dd3fc" font-family="system-ui, monospace" font-size="9" font-weight="700">POEST</text>
    <rect x="46" y="58" width="14" height="4.5" rx="2" fill="#38bdf8" />
  </g>

  <!-- TOP RIGHT: "ONLINE" STATUS PILL -->
  <g transform="translate(390, 46)">
    <rect x="0" y="0" width="68" height="24" rx="12" fill="#0c2340" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="14" cy="12" r="4.5" fill="#22c55e" filter="url(#greenGlow)" />
    <circle cx="14" cy="12" r="2.5" fill="#86efac" />
    <text x="25" y="16" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.8">ONLINE</text>
  </g>

  <!-- RIGHT BACKGROUND: 3D NEURAL NETWORK / CONSTELLATION MESH -->
  <g opacity="0.6" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <!-- Connecting neural lines -->
    <line x1="410" y1="120" x2="445" y2="145" />
    <line x1="445" y1="145" x2="425" y2="180" />
    <line x1="425" y1="180" x2="385" y2="160" />
    <line x1="385" y1="160" x2="410" y2="120" />
    <line x1="445" y1="145" x2="470" y2="175" />
    <line x1="470" y1="175" x2="455" y2="215" />
    <line x1="455" y1="215" x2="425" y2="180" />
    <line x1="425" y1="180" x2="400" y2="210" />
    <line x1="400" y1="210" x2="385" y2="160" />
    <line x1="400" y1="210" x2="435" y2="235" />
    <line x1="435" y1="235" x2="455" y2="215" />
    <line x1="435" y1="235" x2="465" y2="255" />
    <line x1="410" y1="120" x2="380" y2="135" />
    <line x1="380" y1="135" x2="365" y2="165" />
    
    <!-- Glowing nodes -->
    <circle cx="410" cy="120" r="3" fill="#38bdf8" filter="url(#cyanGlowSoft)" />
    <circle cx="445" cy="145" r="3.5" fill="#bae6fd" filter="url(#cyanGlowSoft)" />
    <circle cx="425" cy="180" r="4" fill="#38bdf8" filter="url(#cyanGlowSoft)" />
    <circle cx="385" cy="160" r="3" fill="#38bdf8" />
    <circle cx="470" cy="175" r="3" fill="#38bdf8" />
    <circle cx="455" cy="215" r="3.5" fill="#bae6fd" />
    <circle cx="400" cy="210" r="3" fill="#38bdf8" />
    <circle cx="435" cy="235" r="3.5" fill="#38bdf8" />
    <circle cx="465" cy="255" r="3" fill="#38bdf8" />
    <circle cx="380" cy="135" r="2.5" fill="#38bdf8" />
  </g>

  <!-- HOLOGRAPHIC CHAT BUBBLES -->
  <!-- Left Bubble 1 -->
  <g transform="translate(46, 172)" opacity="0.7">
    <rect x="0" y="0" width="72" height="38" rx="8" fill="#1e3a6a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
    <polygon points="12,38 18,44 24,38" fill="#1e3a6a" />
    <rect x="10" y="10" width="52" height="4" rx="2" fill="#ffffff" opacity="0.9" />
    <rect x="10" y="18" width="40" height="4" rx="2" fill="#ffffff" opacity="0.6" />
    <rect x="10" y="26" width="30" height="4" rx="2" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Left Bubble 2 (Lower) -->
  <g transform="translate(46, 255)" opacity="0.65">
    <rect x="0" y="0" width="68" height="30" rx="8" fill="#1e3a6a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
    <polygon points="12,30 18,36 24,30" fill="#1e3a6a" />
    <rect x="10" y="9" width="46" height="4" rx="2" fill="#ffffff" opacity="0.9" />
    <rect x="10" y="17" width="32" height="4" rx="2" fill="#ffffff" opacity="0.5" />
  </g>

  <!-- Right Bubble -->
  <g transform="translate(378, 250)" opacity="0.85">
    <rect x="0" y="0" width="82" height="42" rx="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.2" />
    <polygon points="0,16 -8,22 0,28" fill="#f8fafc" />
    <rect x="14" y="12" width="54" height="4.5" rx="2" fill="#0284c7" opacity="0.8" />
    <rect x="14" y="21" width="42" height="4.5" rx="2" fill="#0284c7" opacity="0.5" />
    <rect x="14" y="30" width="28" height="4.5" rx="2" fill="#0284c7" opacity="0.3" />
  </g>

  <!-- CLOTHING / SUIT & SHIRT -->
  <!-- Shoulders & Jacket -->
  <path d="M70 490 C 80 400, 150 360, 250 360 C 350 360, 420 400, 430 490 L 450 500 L 50 500 Z" fill="url(#suitGrad)" />
  <path d="M70 490 C 80 400, 150 360, 250 360 C 350 360, 420 400, 430 490 L 450 500 L 50 500 Z" fill="url(#pinstripes)" />

  <!-- Dress Shirt Body -->
  <polygon points="250,360 195,430 305,430" fill="#e0f2fe" />
  <polygon points="250,380 215,500 285,500" fill="#bae6fd" />
  <line x1="250" y1="410" x2="250" y2="500" stroke="#94a3b8" stroke-width="1.2" />
  <circle cx="250" cy="445" r="2.5" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" />
  <circle cx="250" cy="485" r="2.5" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" />

  <!-- Shirt Spread Collar -->
  <polygon points="175,355 242,418 200,422" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <polygon points="325,355 258,418 300,422" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

  <!-- Suit Lapels (Left & Right) -->
  <polygon points="170,362 238,472 152,500 120,410" fill="#1b2331" stroke="#334155" stroke-width="1" />
  <polygon points="170,362 238,472 152,500 120,410" fill="url(#pinstripes)" />

  <polygon points="330,362 262,472 348,500 380,410" fill="#242f40" stroke="#334155" stroke-width="1" />
  <polygon points="330,362 262,472 348,500 380,410" fill="url(#pinstripes)" />

  <!-- NECK -->
  <path d="M208 305 L 208 365 C 228 382, 272 382, 292 365 L 292 305 Z" fill="#b07246" />
  <!-- Neck Shadow under chin -->
  <path d="M210 305 C 230 338, 270 338, 290 305 L 290 335 C 270 355, 230 355, 210 335 Z" fill="#91562e" opacity="0.6" />

  <!-- HEAD & EARS -->
  <ellipse cx="250" cy="242" rx="82" ry="102" fill="url(#skinGrad)" />
  <circle cx="215" cy="245" r="28" fill="url(#cheekHighlight)" />
  <circle cx="285" cy="245" r="28" fill="url(#cheekHighlight)" />

  <!-- Ears with realistic folds -->
  <ellipse cx="168" cy="245" rx="14" ry="24" fill="#c98a5e" />
  <path d="M168 232 C 162 240, 162 250, 168 258" stroke="#9e6642" stroke-width="2.5" fill="none" />

  <ellipse cx="332" cy="245" rx="14" ry="24" fill="#c98a5e" />
  <path d="M332 232 C 338 240, 338 250, 332 258" stroke="#9e6642" stroke-width="2.5" fill="none" />

  <!-- HAIR (Modern Side-Styled with Texture) -->
  <path d="M168 215 C 160 135, 205 92, 258 92 C 318 92, 342 135, 332 215 C 322 188, 308 168, 278 165 C 242 162, 198 178, 168 215 Z" fill="url(#hairGrad)" />
  <!-- Hair volume top & sweeps -->
  <path d="M182 165 C 220 115, 295 118, 330 178 C 320 130, 282 102, 248 102 C 205 102, 185 125, 182 165 Z" fill="url(#hairHighlight)" opacity="0.65" />
  <path d="M220 115 C 255 105, 290 120, 305 145" stroke="#4a3e38" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- EYEBROWS (Strong, Neatly Groomed Dark Brows) -->
  <path d="M198 205 C 210 196, 228 198, 238 206" stroke="#141110" stroke-width="5.5" stroke-linecap="round" fill="none" />
  <path d="M262 206 C 272 198, 290 196, 302 205" stroke="#141110" stroke-width="5.5" stroke-linecap="round" fill="none" />

  <!-- EYES (Warm, Expressive Almond Shape with Catchlights) -->
  <!-- Left Eye -->
  <path d="M204 220 C 212 212, 226 212, 234 220 C 226 226, 212 226, 204 220 Z" fill="#ffffff" />
  <ellipse cx="219" cy="219.5" rx="6.5" ry="6.5" fill="#2d1c15" />
  <circle cx="219" cy="219.5" r="3.2" fill="#0f0907" />
  <circle cx="221.5" cy="217.5" r="1.8" fill="#ffffff" />
  <path d="M202 219 C 210 211, 228 211, 236 219" stroke="#141110" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Right Eye -->
  <path d="M266 220 C 274 212, 288 212, 296 220 C 288 226, 274 226, 266 220 Z" fill="#ffffff" />
  <ellipse cx="281" cy="219.5" rx="6.5" ry="6.5" fill="#2d1c15" />
  <circle cx="281" cy="219.5" r="3.2" fill="#0f0907" />
  <circle cx="283.5" cy="217.5" r="1.8" fill="#ffffff" />
  <path d="M264 219 C 272 211, 290 211, 298 219" stroke="#141110" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- NOSE -->
  <path d="M250 208 L 245 248 C 247 252, 253 252, 255 248 Z" fill="#9e6642" opacity="0.45" />
  <path d="M239 251 C 245 255, 255 255, 261 251" stroke="#874e2b" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="242" cy="250" r="2" fill="#6d3a1c" opacity="0.7" />
  <circle cx="258" cy="250" r="2" fill="#6d3a1c" opacity="0.7" />

  <!-- MUSTACHE & BEARD -->
  <!-- Mustache with clean center gap & side sweep -->
  <path d="M228 266 C 240 261, 247 264, 250 268 C 253 264, 260 261, 272 266 C 266 273, 254 274, 250 271 C 246 274, 234 273, 228 266 Z" fill="#141110" />

  <!-- MOUTH / WARM SMILE WITH TEETH -->
  <path d="M231 273 C 241 288, 259 288, 269 273 Z" fill="#450a0a" />
  <!-- Upper row clean white teeth -->
  <path d="M234 273 C 242 280, 258 280, 266 273 Z" fill="#ffffff" />
  <!-- Smile contour line -->
  <path d="M228 272 C 240 290, 260 290, 272 272" stroke="#881337" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- FULL WELL-GROOMED BEARD -->
  <path d="M188 238 C 188 305, 210 342, 250 342 C 290 342, 312 305, 312 238 C 306 265, 295 290, 280 302 C 270 312, 260 316, 250 316 C 240 316, 230 312, 220 302 C 205 290, 194 265, 188 238 Z" fill="#141110" />
  <!-- Soul patch -->
  <polygon points="247,288 253,288 250,298" fill="#141110" />

  <!-- OVER-EAR HEADSET (METALLIC SILVER & GLOWING CYAN LEDS) -->
  <!-- Top Overhead Band (Metallic Structure) -->
  <path d="M165 245 C 150 110, 350 110, 335 245" stroke="#475569" stroke-width="14" stroke-linecap="round" fill="none" />
  <!-- Cushion padding -->
  <path d="M185 180 C 175 118, 325 118, 315 180" stroke="#1e293b" stroke-width="18" stroke-linecap="round" fill="none" />

  <!-- SEGMENTED NEON CYAN GLOWING ARC ON HEADBAND -->
  <path d="M200 128 C 228 114, 272 114, 300 128" stroke="#38bdf8" stroke-width="6.5" stroke-linecap="round" fill="none" filter="url(#cyanGlow)" />
  <path d="M202 128 C 228 115, 272 115, 298 128" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Left Earcup (Viewer's Left) -->
  <rect x="150" y="210" width="26" height="56" rx="13" fill="#1e293b" stroke="#64748b" stroke-width="2.5" />
  <ellipse cx="163" cy="238" rx="8" ry="16" fill="#0f172a" />
  <circle cx="163" cy="238" r="6" fill="#38bdf8" filter="url(#cyanGlowSoft)" />

  <!-- Right Earcup (Viewer's Right) -->
  <rect x="324" y="210" width="26" height="56" rx="13" fill="#1e293b" stroke="#64748b" stroke-width="2.5" />
  <ellipse cx="337" cy="238" rx="8" ry="16" fill="#0f172a" />
  <circle cx="337" cy="238" r="6" fill="#38bdf8" filter="url(#cyanGlowSoft)" />

  <!-- BOOM MICROPHONE ARM & GLOWING CYAN CAPSULE TIP -->
  <!-- Arm sweeping down toward mouth from right earcup -->
  <path d="M338 252 C 348 298, 315 310, 278 298" stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M338 252 C 348 298, 315 310, 278 298" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Glowing Cyan Capsule Microphone Tip -->
  <rect x="264" y="291" width="18" height="12" rx="6" fill="#00e5ff" filter="url(#cyanGlow)" />
  <rect x="266" y="293" width="14" height="8" rx="4" fill="#ffffff" />
</svg>
